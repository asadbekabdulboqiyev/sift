version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      # G104 (unhandled errors) is covered by errcheck; duplicate rules just
      # slow the linter down.
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Tests legitimately ignore errors and use magic numbers.
      #
      # errcheck was measured with this rule removed (golangci-lint v2.14.0,
      # 2026-11-20): +295 findings, 72 of them `fmt.Fprint`, 42 `fmt.Fprintf`,
      # 36 `io.WriteString` and the rest mostly `Close()` on test fixtures.
      # Fixing them means editing ~70 test files for no behavior gain, so this
      # exclusion is kept deliberately. Production-code errcheck debt was cleared
      # in Phase 2 (see docs/LINT-DEBT-TRIAGE.md); deliberate discards use an
      # explicit `_ = call(...)` convention (errcheck ignores blank assignments
      # unless check-blank is on). Revisit only if test-policy requirements change.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
      # Detector signatures and reference URLs (OWASP/WSTG/MDN/RFC links, PSV-*
      # check IDs, A0*-category labels, the ss-canary.invalid canary hostname,
      # the root:x:0:0: /etc/passwd detection signature). These are intentional
      # non-secret strings that pattern-match gosec G101. They are reviewed
      # false positives frozen in .gosec-baseline.json; the dedicated `security`
      # CI job still runs full gosec (ratchet) over every file.
      - path: internal/scanner/(checks_passive|intrusive)\.go
        linters:
          - gosec
      # Generated protobuf code.
      - path: \.pb\.go$
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/asadbekabdulboqiyev/sift

issues:
  # The CI ratchet was removed after Phase 3: `golangci-lint run ./...` is clean
  # at 0 issues with golangci-lint v2.14.0, so CI now fails on every finding.
  # The debt was paid down in tracked phases (738 -> 510 -> 145 -> 0); see
  # docs/LINT-DEBT-TRIAGE.md for the per-phase breakdown and suppression policy.
  max-issues-per-linter: 0
  max-same-issues: 0
