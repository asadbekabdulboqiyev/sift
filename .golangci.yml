version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      # G104 (unhandled errors) is covered by errcheck; duplicate rules just
      # slow the linter down.
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Tests legitimately ignore errors and use magic numbers.
      #
      # errcheck was measured with this rule removed (golangci-lint v2.14.0,
      # 2026-11-20): +295 findings, 72 of them `fmt.Fprint`, 42 `fmt.Fprintf`,
      # 36 `io.WriteString` and the rest mostly `Close()` on test fixtures.
      # Fixing them means editing ~70 test files, which would swamp the
      # `only-new-issues` ratchet with noise rather than catch real bugs.
      # Deliberate discards already use an explicit `_ = call(...)` convention
      # (errcheck does not flag blank assignments unless check-blank is on).
      # Revisit once the test fixtures are cleaned up, not before.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
      # Detector signatures and reference URLs (OWASP/WSTG/MDN/RFC links, PSV-*
      # check IDs, A0*-category labels, the ss-canary.invalid canary hostname,
      # the root:x:0:0: /etc/passwd detection signature). These are intentional
      # non-secret strings that pattern-match gosec G101. They are reviewed
      # false positives frozen in .gosec-baseline.json; the dedicated `security`
      # CI job still runs full gosec (ratchet) over every file.
      - path: internal/scanner/(checks_passive|intrusive)\.go
        linters:
          - gosec
      # Generated protobuf code.
      - path: \.pb\.go$
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/asadbekabdulboqiyev/sift

issues:
  # The CI ratchet (`only-new-issues: true` in .github/workflows/ci.yml) is
  # deliberately kept. A full `golangci-lint run ./...` at HEAD 605dc57 with
  # golangci-lint v2.14.0 reported 755 issues (368 errcheck, 172 revive, 119
  # staticcheck, 40 unused, 32 gocritic, 8 goimports, 7 gosec, 6 ineffassign,
  # 3 unconvert). Removing the ratchet would turn CI red on 755 pre-existing
  # findings unrelated to any given change; the ratchet still fails every new
  # one. That legacy backlog is tracked debt, not part of this cleanup.
  max-issues-per-linter: 0
  max-same-issues: 0
