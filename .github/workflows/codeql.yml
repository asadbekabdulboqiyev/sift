name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so newly published advisories get checked even without a push.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning — the SARIF upload that is the entire point of this job —
    # needs GitHub Advanced Security on a private repository, which is a paid
    # add-on. Without it the upload is rejected, so the job would fail on every
    # push while telling us nothing. Skipping keeps the pipeline honest: green
    # means "the analysis ran and its results landed". If GHAS is ever enabled
    # for this repository, delete this condition; if the repository is made
    # public again, it resumes on its own.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Go gets the interesting analysis here: the load engine, the PCAP
        # replay parser and the fleet gRPC control plane all take untrusted
        # input. Also scan the shell/JS the repo ships so a compromised deploy
        # script is not a blind spot.
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          # Single source of truth: the patch-pinned directive in go.mod.
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          # `languages`, not `language`. The action's input is plural; with the
          # singular spelling it is silently ignored ("Unexpected input(s)
          # 'language'"), so CodeQL fell back to autodetecting every language in
          # the repo (go, javascript, ruby, actions) and then died on
          # "Go does not support the none build mode".
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Go supports only autobuild/manual, never "none". This repo is a
          # server *and* a CLI, so build manually: the explicit `go build ./...`
          # below also compiles ./cmd/..., which the autobuilder skips.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

      - name: Build for CodeQL
        if: matrix.language == 'go'
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

  # ── one required status check ─────────────────────────────────────────────
  # Configure branch protection to require only `codeql-ok` from this
  # workflow. Without an aggregate, a green subset of matrix legs could still
  # merge a build whose other language leg was red. `if: always()` is
  # required: with the default condition GitHub marks this job "skipped"
  # when a needed job fails, and a skipped required check does not give
  # branch protection a clear failure.
  #
  # MAY_SKIP holds the one job with a deliberate job-level `if:`. `analyze`
  # skips on private repositories, where SARIF upload needs a paid add-on;
  # that is a no-run by design, not a failure. Every other result must be
  # "success", and a failure or a cancellation fails this gate.
  codeql-ok:
    name: codeql-ok
    if: always()
    needs:
      - analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CodeQL job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: '["analyze"]'
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS"])
          may_skip = set(json.loads(os.environ["MAY_SKIP"]))
          bad = {
              name: item["result"]
              for name, item in results.items()
              if item["result"] != "success"
              and not (name in may_skip and item["result"] == "skipped")
          }
          if bad:
              for name, result in sorted(bad.items()):
                  print("::error::job %s finished with result %s" % (name, result))
              sys.exit(1)
          print("all %d codeql jobs passed" % len(results))
          PY
