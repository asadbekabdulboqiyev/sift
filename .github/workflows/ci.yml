name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref, but never cancel a release-gating run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Supply-chain policy: every `uses:` in this file is pinned to a full 40-char
# commit SHA with the semver tag in a trailing comment. Major tags (@v4, @v5,
# ...) are mutable: a force-pushed tag can change the code this workflow runs
# without any change in this repository. Dependabot reads the trailing `# vX`
# comment and still proposes upgrades. Resolved with `git ls-remote --tags
# <repo>`; do not replace a pin with a bare tag to "simplify" it.
env:
  # Go is patch-pinned in ONE place: the `go 1.26.11` directive in go.mod, which
  # every setup-go step below reads via `go-version-file: go.mod`. A "1.26" pin
  # could silently select 1.26.10, which carries GO-2026-6859 (a reachable
  # net/http MaxBytesReader header-race crash fixed in 1.26.11).
  # Pinned tool versions so CI failures are never caused by a tool auto-update.
  # Must be built with a Go >= the module's, or the linter refuses to load the
  # config: "the Go language version (go1.24) used to build golangci-lint is
  # lower than the targeted Go version (1.26)". v2.14.0 declares go 1.26.0.
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  # ── gofmt / vet / lint ─────────────────────────────────────────────────────
  # No libpcap install: internal/replay reads PCAP via gopacket/pcapgo (pure
  # Go), so the whole module vets and tests without libpcap-dev. The previous
  # workflow installed it in 3 jobs for no reason.
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -u go.mod.bak go.mod || ! diff -u go.sum.bak go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit"
            exit 1
          fi

      - name: Verify module checksums
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Full-repo lint: the lint debt reached 0 in Phase 3, so every finding
          # now fails CI (no `only-new-issues` ratchet). See docs/LINT-DEBT-TRIAGE.md.
          args: --timeout=10m

  # ── shellcheck: lint all shell scripts ──────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shellcheck on all scripts
        # SHA-pinned: @master is a moving supply-chain surface. This is the
        # 2.0.0 tag commit (the repo does not prefix tags with "v"); `scandir`
        # is still a supported input there.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts deploy

  # ── deploy manifests: lint/render locally, no cluster required ─────────────
  # Both Helm and Docker Compose ship with ubuntu-latest. These checks run on
  # every PR, so a broken chart or an unparsable compose file is caught here
  # instead of on the remote host at deploy time.
  deploy-validate:
    name: Deploy manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tool versions
        run: |
          set -euo pipefail
          helm version --short
          docker compose version

      - name: Lint the Helm chart
        run: helm lint ./deploy/charts/sift

      - name: Render the Helm chart (default values)
        run: helm template sift ./deploy/charts/sift > /tmp/sift-rendered.yaml

      - name: Render the Helm chart (ingress enabled)
        run: helm template sift ./deploy/charts/sift --set ingress.enabled=true > /tmp/sift-ingress.yaml

      - name: Validate docker-compose.yml
        # -q validates interpolation/structure without contacting a registry.
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: HPA target matches the rendered worker Deployment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys

          # Parse the scaleTargetRef block by indentation instead of assuming
          # `name:` is the very next line: apiVersion/kind and comments may sit
          # between the key and the target name.
          hpa_lines = open("deploy/hpa/worker-hpa.yaml", encoding="utf-8").read().splitlines()
          target = None
          for i, line in enumerate(hpa_lines):
              if line.strip() != "scaleTargetRef:":
                  continue
              base_indent = len(line) - len(line.lstrip())
              for child in hpa_lines[i + 1:]:
                  if not child.strip():
                      continue
                  indent = len(child) - len(child.lstrip())
                  if indent <= base_indent:
                      break  # left the scaleTargetRef block
                  m = re.match(r"\s*name:\s*(\S+)", child)
                  if m:
                      target = m.group(1)
                      break
              break

          if not target:
              sys.exit("HPA has no scaleTargetRef.name")
          names = re.findall(r"^  name:\s*(\S+)", open("/tmp/sift-rendered.yaml", encoding="utf-8").read(), re.M)
          if target not in names:
              sys.exit(f"HPA target {target!r} is not a rendered resource name: {names}")
          print(f"HPA target {target} matches the Helm-rendered Deployment")
          PY

      - name: Validate the Grafana dashboard JSON
        # F13 monitoring needs an external Prometheus/Grafana/Alertmanager
        # stack; this repo cannot provision one. At least prove the shipped
        # dashboard parses instead of shipping silently broken JSON.
        run: python3 -m json.tool observability/grafana/dashboard.json > /dev/null

  # ── unit + integration tests, race detector, coverage ──────────────────────
  test:
    name: Test (${{ matrix.os }}, race)
    runs-on: ${{ matrix.os }}
    # Serial packages (-p 1, see the test step) take longer wall-clock time;
    # 30 m was the parallel budget and can expire before the suite finishes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The race detector only works where cgo works, so keep the matrix to
        # the platforms CI actually supports well.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Race + coverage
        # Force bash instead of the Windows default (pwsh). PowerShell does not
        # pass these argv items through verbatim: `-coverprofile=coverage.out`
        # reached `go` mangled, so go saw a package named `.out` and died with
        # "no required module provides package .out". bash preserves argv on
        # every runner, so one command works on ubuntu, macOS and Windows.
        shell: bash
        # -count=1 is MANDATORY: setup-go restores GOCACHE from an earlier run,
        # and `go test` otherwise prints `(cached)` without running a single
        # test. That silently disabled the race detector and reused a stale
        # coverage profile, so this command must always execute every test.
        # -p 1 is a correctness setting here, not a speed one. On a macOS host
        # with the default 49152-65535 ephemeral range (16 384 ports) and a
        # 15 s TIME_WAIT, the load/protocol packages collectively exhaust the
        # range at full parallelism and unrelated tests fail while dialling
        # their own loopback listeners with EADDRNOTAVAIL. Measured locally:
        # 3/60 packages failed with default -p, all passed in isolation, and
        # `go test -p 1 ./...` passed all 61 packages. Same tests, no skips.
        run: go test -p 1 -race -count=1 -timeout 20m -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
        env:
          # Keep CI workers from being starved by the engine's own load tests.
          GOMAXPROCS: 4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      # Go writes CRLF on Windows; normalise before the toolchain that
      # verifies the uploaded profile touches it.
      - name: Normalise coverage profile line endings
        if: runner.os == 'Windows'
        run: |
          $p = "coverage.out"
          (Get-Content $p -Raw) -replace "`r`n", "`n" | Set-Content -NoNewline $p

  # ── fast unit tests: default build, no `integration` tag ───────────────────
  # Files that start with `//go:build integration` are invisible to a plain
  # `go test ./...`, so this job is the fast feedback loop: unit tests only,
  # no real load runs and no long-lived loopback listeners. The `test` job
  # above still runs this same set under -race with coverage on three OSes;
  # this job pins the exact command a developer runs locally.
  test-unit:
    name: Unit tests (default build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fast unit tests
        run: go test ./... -count=1

  # ── heavy integration tests: `integration` tag only ────────────────────────
  # These are the load/protocol/E2E tests: they open real loopback listeners,
  # drive multi-second runs and can consume the host ephemeral port range
  # (16 384 ports on macOS). Kept out of the default build so they never
  # starve a developer's feedback loop or break an unrelated dial with
  # EADDRNOTAVAIL. GOFLAGS=-p=1 serialises packages (the same correctness
  # setting the `test` job uses) while keeping the documented command intact.
  test-integration:
    name: Integration tests (tagged)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Heavy integration tests
        # -count=1 defeats setup-go's restored GOCACHE (a cached result would
        # never execute the tagged tests); -race makes this job catch data
        # races in the long-lived loopback listeners, not just the unit build.
        run: go test -race -tags=integration ./... -count=1

  # ── focused integration regressions ───────────────────────────────────────
  # The broad job above runs every tagged test. This job pins the smaller set of
  # packages that carry the cross-component integration regressions: distributed
  # timing integrity, engine protocol runs, evidence bundling, OWASP edge cases
  # and in-process CLI flows. A failure here is therefore easy to attribute to a
  # specific subsystem instead of being lost in the full matrix. -short skips
  # only the tests that explicitly opt out; every other tagged test in these
  # packages still runs.
  test-integration-focused:
    name: Integration regressions (focused)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused integration regressions
        # -count=1 defeats setup-go's restored GOCACHE; -race keeps the
        # long-lived loopback listeners honest. The package list is explicit so
        # adding an unrelated integration package cannot silently change this
        # gate.
        run: |
          go test -race -tags=integration -short -count=1 -timeout 10m \
            ./cmd/sift \
            ./internal/dist/coordinator \
            ./internal/engine \
            ./internal/evidence \
            ./internal/scanner/owasp

  # ── coverage gate ─────────────────────────────────────────────────────────
  # -coverpkg=./... in the test job is what makes this number meaningful; the
  # old workflow ran plain `go test` so per-package coverage flattered itself.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Each runner writes a coverage profile with its own "mode:" header.
      # The artifacts are downloaded into separate directories and merged
      # here on purpose: download-artifact's own merge concatenates files
      # that share a name, and the result is a profile go tool cover cannot
      # parse — it reported "cover: line \"mode: atomic\" doesn't match
      # expected format" and then "couldn't find a before NumStmt" on a
      # truncated line. Merging by hand keeps exactly one header and gives
      # every line its own newline.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Merge the coverage profiles
        run: |
          set -euo pipefail
          awk 'FNR == 1 && NR != 1 { next } { print }' \
            coverage-artifacts/*/coverage.out > coverage.out
          head -1 coverage.out

      - name: Report total
        run: go tool cover -func=coverage.out | tail -1

      - name: Enforce minimum
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          if [ -z "$total" ]; then
            echo "::error::could not read the total coverage from coverage.out"
            exit 1
          fi
          echo "total coverage: ${total}%"
          # CONTRIBUTING.md documents >=70%; CI now enforces a stricter 75%.
          # The merged, -coverpkg=./... aggregate measures about 76.2%, so the
          # old 70% floor let a multi-point regression stay green. Keep raising
          # this in small steps (75 -> 76 -> ...) as coverage grows; never lower
          # it to turn a red build green. About one point of headroom is kept
          # for measurement noise across the three runner OSes.
          floor=75
          ok=$(awk -v t="$total" -v f="$floor" 'BEGIN{print (t+0 >= f+0) ? "true" : "false"}')
          if [ "$ok" != "true" ]; then
            echo "::error::coverage ${total}% is below the ${floor}% floor"
            exit 1
          fi

      # Deliberately no Codecov upload step. The 75% floor above is the gate:
      # it runs offline, is deterministic, and cannot be broken by an external
      # service changing its tokenless-upload policy. In 2026 Codecov began
      # rejecting tokenless uploads from public repos; with no CODECOV_TOKEN
      # secret configured, `fail_ci_if_error: true` turned a pure reporting
      # step into a spurious red build. Keep the floor above authoritative.

  # ── cross-compile smoke: ALL 6 binaries on every release target ────────────
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The previous matrix had 3 entries and compiled only
        # ./cmd/sift — 1 of 6 binaries, missing linux/arm64,
        # darwin/amd64 and windows/arm64.
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the version package compiles on its own
        run: go build ./internal/version/

      - name: Cross-compile all binaries
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p out
          # `./cmd/...` is a Go package pattern, not a shell glob — in bash `...`
          # means "exactly three characters" (`???`), so it never matched, and
          # basename turned the literal argument into "..." -> `go build -o out/...`
          # -> "cannot write multiple packages to non-directory". Iterate the
          # directories themselves and name the package explicitly.
          #
          # Directory names are lowercase (cmd/sift, cmd/sift-master, ...) but
          # the shipped binary names are not: .goreleaser.yaml declares
          # `binary: Sift`, `binary: Sift-master`, and so on, and the release
          # archives, Dockerfile and README all use those names. Map dir ->
          # binary here too, otherwise this job writes out/sift and the
          # "Run the built CLI" step below dies with `./out/Sift: No such file
          # or directory` (exit 127).
          for dir in ./cmd/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            case "$name" in
              sift)   bin=Sift ;;
              sift-*) bin="Sift-${name#sift-}" ;;
              *)      bin="$name" ;;
            esac
            out="out/${bin}"
            [ "${{ matrix.os }}" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
              go build -trimpath \
                -ldflags="-s -w \
                          -X github.com/asadbekabdulboqiyev/sift/internal/version.Version=${version}" \
                -o "$out" "./cmd/${name}"
            echo "  built ${bin} (${{ matrix.os }}/${{ matrix.arch }}) $(du -h "$out" | cut -f1)"
          done

      - name: Run the built CLI (linux/amd64 only)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: ./out/Sift --version && ./out/Sift --help > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          retention-days: 7

  # ── benchmarks: published AND gated against the previous run ──────────────
  # Publishing alone was not a gate: the job could never fail, regardless of
  # what the numbers said. This job keeps the artifact, downloads the newest
  # earlier `benchmarks` artifact from a successful CI run, and fails when any
  # benchmark median is more than 10% slower than that baseline. benchstat does
  # the parsing; the threshold is applied to its machine-readable sec/op output
  # so the gate does not depend on benchstat's significance display.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      BENCH_REGRESSION_PCT: "10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        # Pinned pseudo-version of golang.org/x/perf. `go install pkg@version`
        # runs outside the main module, so go.mod and go.sum stay untouched.
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c

      - name: Run benchmarks
        # -count=8 gives benchstat enough samples for a real confidence
        # interval; -benchtime=200ms keeps the 21 benchmarks inside the budget.
        # A single 1s sample per benchmark could not support any comparison.
        run: |
          set -euo pipefail
          go test -run '^$' -bench=. -benchmem -benchtime=200ms -count=8 ./... 2>&1 | tee bench.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmarks
          path: bench.txt
          if-no-files-found: error
          retention-days: 30

      - name: Download the previous benchmark baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          run_ids="$(gh run list --workflow ci.yml --status success --limit 30 --json databaseId --jq '.[].databaseId')"
          baseline_file=""
          for id in $run_ids; do
            [ "$id" = "$RUN_ID" ] && continue
            # An expired or missing artifact is a normal outcome; try the next
            # run. The failed download is handled by the `if` condition, not by
            # an error-suppression suffix. If no run has a usable artifact,
            # this run publishes the first baseline and says so explicitly.
            if gh run download "$id" --name benchmarks --dir baseline >/dev/null 2>&1; then
              baseline_file="$(find baseline -type f -name bench.txt -print -quit)"
              if [ -n "$baseline_file" ]; then
                echo "baseline: run $id ($baseline_file)"
                break
              fi
            fi
          done
          if [ -z "$baseline_file" ]; then
            echo "::notice::no earlier benchmarks artifact found; this run only publishes a baseline"
            exit 0
          fi
          echo "$baseline_file" > baseline-path.txt

      - name: Compare with the baseline (10% threshold)
        if: hashFiles('baseline-path.txt') != ''
        run: |
          set -euo pipefail
          baseline_file="$(cat baseline-path.txt)"
          benchstat -format=csv "$baseline_file" bench.txt > benchstat.csv
          cat benchstat.csv

          python3 - benchstat.csv <<'PY'
          import csv
          import os
          import sys

          pct_limit = float(os.environ["BENCH_REGRESSION_PCT"])
          limit = 1.0 + pct_limit / 100.0
          with open(sys.argv[1], newline="", encoding="utf-8") as fh:
              rows = list(csv.reader(fh))

          # benchstat emits one sec/op table per package/configuration. Check
          # all of them; looking only at the first would miss a regression in
          # every other package.
          regressions = []
          compared = 0
          tables = 0
          in_table = False
          for row in rows:
              if len(row) > 1 and row[1] == "sec/op":
                  tables += 1
                  in_table = True
                  continue
              if not in_table:
                  continue
              if not row or not row[0].strip():
                  in_table = False
                  continue
              name = row[0].strip()
              try:
                  old = float(row[1])
                  new = float(row[3])
              except (ValueError, IndexError):
                  continue
              if old <= 0:
                  continue
              compared += 1
              ratio = new / old
              if ratio > limit:
                  regressions.append((name, old, new, (ratio - 1) * 100))

          if tables == 0 or compared == 0:
              sys.exit("::error::benchstat produced no comparable sec/op rows; refusing to pass an empty gate")
          print("compared %d medians across %d table(s) against +%g%%" % (compared, tables, pct_limit))
          if regressions:
              for name, old, new, pct in regressions:
                  print("::error::%s: %.9f -> %.9f sec/op (+%.1f%%)" % (name, old, new, pct))
              sys.exit(1)
          print("no benchmark regressed by more than %g%%" % pct_limit)
          PY

  # ── fuzz: every parser that reads untrusted bytes, on every push ──────────
  # A security scanner's input is hostile by construction, and the replay tool
  # parses capture files and TCP streams nobody controls. Table tests sample
  # those parsers; this job explores them. Each target runs for 180s (three
  # minutes; 45s mostly re-ran the seed corpus). The five targets run in
  # parallel, so the job still fits in its 20-minute budget. The corpus is
  # cached across runs instead of restarting from the seed set.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParseHTTPStream
            package: ./internal/replay/
            corpus: internal/replay
          - target: FuzzParseHARBytes
            package: ./internal/replay/
            corpus: internal/replay
          - target: FuzzAnalyzeJWT
            package: ./internal/scanner/
            corpus: internal/scanner
          - target: FuzzPassiveParseSetCookie
            package: ./internal/scanner/
            corpus: internal/scanner
          - target: FuzzPassiveParseCSP
            package: ./internal/scanner/
            corpus: internal/scanner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Restore the corpus this target accumulated on earlier runs. Without it
      # every run re-discovers the same inputs and most of the 180s is wasted.
      #
      # Go keeps a fuzz corpus in $GOCACHE/fuzz/<import path>/<target>, and
      # GOCACHE is ~/.cache/go-build on the ubuntu runner. This step used to
      # cache ~/.cache/go-fuzz, which Go never writes, so it restored nothing.
      #
      # The old primary key ended in github.run_id, which is unique to this
      # run: the save key never matched an existing cache, so only the broad
      # restore key ever helped. The primary key is now stable for a given ref
      # and module graph, with stepwise restore-keys for older corpora.
      - name: Restore corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz/github.com/asadbekabdulboqiyev/sift/${{ matrix.corpus }}/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.ref_name }}
          restore-keys: |
            fuzz-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            fuzz-${{ matrix.target }}-${{ runner.os }}-

      - name: Fuzz ${{ matrix.target }}
        run: |
          go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 180s ${{ matrix.package }}

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/'
          retention-days: 30

  # ── docker: all three images, both architectures, build-only on PRs ────────
  # The previous workflow only built Dockerfile (the all-in-one) — the master
  # and worker images shipped completely untested.
  docker:
    name: Docker ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No `needs: [test]`: this builds the three Dockerfiles from source and
    # shares no state with the 45-minute, 3-OS race matrix. Waiting for it only
    # delayed image failures and serialized independent work.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: Sift
          - dockerfile: Dockerfile.master
            image: Sift-master
          - dockerfile: Dockerfile.worker
            image: Sift-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  # ── verifiable evidence: prove the product claim end to end ────────────────
  # Sift's entire promise is that a third party can verify a load-test
  # result offline: `Sift verify` exits 0 for a genuine bundle and 1
  # for one whose evidence was altered after signing. This job exercises that
  # against a real target and asserts BOTH directions — the positive gate would
  # catch a verifier that rejects good evidence, the negative gate the far worse
  # case of a verifier that accepts tampered evidence. Without the negative gate
  # the claim is untested, because a `verify` stub that always exits 0 would
  # pass the positive gate alone.
  #
  # Deliberately independent of the other jobs (no `needs:`): it shares nothing
  # with them, and its failure should be unambiguous. Nothing is written into
  # the repo tree — the binary, keys, bundles and reports all live under /tmp.
  verifiable-evidence:
    name: Verifiable evidence (run -> verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the CLI
        run: go build -o /tmp/ss ./cmd/sift

      - name: Generate a coordinator key
        run: /tmp/ss keygen --out /tmp/coord.key

      - name: Start the demo target
        run: |
          set -euo pipefail
          go run ./examples/demo_server.go > /tmp/demo_server.log 2>&1 &
          echo $! > /tmp/demo_server.pid

          # Poll /health with a bounded retry loop rather than a bare `sleep`:
          # a fixed delay either races a slow first compile (flake) or wastes
          # seconds on every run.
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/health; then
              echo "target ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::target never became ready; last log lines:"
          tail -n 40 /tmp/demo_server.log || true
          exit 1

      - name: Run a paced load and seal the evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/reports /tmp/ev
          /tmp/ss run \
            --url http://127.0.0.1:8080/health \
            --target-rps 100 --duration 3 --users 4 \
            --coordinated-omission --allow-private --quiet \
            --report-dir /tmp/reports \
            --emit-bundle /tmp/ev/bundle.json \
            --bundle-key /tmp/coord.key

      - name: Positive gate — pristine evidence verifies (exit 0)
        run: |
          set -euo pipefail
          if ! /tmp/ss verify --allow-unpinned --bundle /tmp/ev/bundle.json --samples /tmp/ev/bundle.samples.jsonl; then
            echo "::error::VERIFIABLE-EVIDENCE FAILED: a freshly sealed bundle did not verify"
            exit 1
          fi
          echo "positive gate passed: bundle and sidecar verify (exit 0)"

      - name: Negative gate — tampered evidence is rejected (exit 1)
        run: |
          set -euo pipefail
          # Bump one value inside one line of the sidecar while keeping the JSON
          # valid, so the record still parses and the rejection can only come
          # from the commitment itself (recomputed Merkle root, aggregates) —
          # which is exactly the property the product claims. The edit is done
          # in python3 (present on runners) to avoid the macOS/GNU `sed -i`
          # portability trap.
          python3 - /tmp/ev/bundle.samples.jsonl <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, "rb") as fh:
              before = fh.read().splitlines()
          if not before:
              sys.exit("tamper: the sidecar is empty")
          lines = list(before)
          rec = json.loads(lines[0])
          rec["latency_ns"] = int(rec.get("latency_ns", 0)) + 1
          lines[0] = json.dumps(rec, sort_keys=True, separators=(",", ":")).encode()
          if lines[1:] != before[1:]:
              sys.exit("tamper: more than one line changed")
          with open(path, "wb") as fh:
              fh.write(b"\n".join(lines) + b"\n")
          print("tampered one value in line 1: latency_ns -> %d" % rec["latency_ns"])
          PY

          # Fail closed means exit 1. Exit 0 here would mean the tool accepted
          # evidence that was altered after it was signed — the one thing it
          # must never do.
          set +e
          /tmp/ss verify --allow-unpinned --bundle /tmp/ev/bundle.json --samples /tmp/ev/bundle.samples.jsonl
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "SECURITY GATE FAILED: tampered evidence verified"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::tampered verification exited ${rc}, want 1"
            exit 1
          fi
          echo "negative gate passed: tampered evidence rejected (exit 1)"

      - name: Sealed summary
        run: |
          python3 - /tmp/ev/bundle.json <<'PY'
          import json, sys
          # No %-formatting here: f-strings keep a literal "95%" from colliding
          # with the escape syntax (and the heredoc is quoted, so { } are safe).
          b = json.load(open(sys.argv[1]))
          agg, integ = b["aggregate"], b["integrity"]
          ci = agg.get("co_ci95_ns", {})
          print(f"  format:                {b['format']}")
          print(f"  sample count:          {agg['count']}")
          # p99_ns is the corrected percentile only when co_corrected is true;
          # otherwise it is the raw one. Label it accurately, never assume.
          print(f"  p99_ns:                {agg['p99_ns']}")
          print(f"  co_corrected:          {agg['co_corrected']}")
          if agg.get("co_corrected"):
              print(f"  95% CI (ns):           [{ci.get('low_ns')}, {ci.get('high_ns')}]")
          else:
              print("  95% CI (ns):           not claimed — co_corrected=false, the run did not keep its arrival schedule")
          print(f"  dropped_samples:       {integ['dropped_samples']}")
          print(f"  schedule_accuracy_ppm: {integ['schedule_accuracy_ppm']}")
          PY

      - name: Stop the demo target
        if: always()
        run: |
          set +e
          if [ -f /tmp/demo_server.pid ]; then
            kill "$(cat /tmp/demo_server.pid)" 2>/dev/null
          fi
          # `go run` compiles to a temporary binary and runs it as a child, so
          # killing the parent alone leaves the server listening. Worse, the
          # child's path is not stable across Go versions (it is
          # $GOCACHE/<hash>-d/demo_server on Go 1.26, not .../exe/demo_server),
          # so match the process *name* exactly and, as a final backstop, kill
          # whatever still holds the port.
          pkill -f 'go run ./examples/demo_server.go' 2>/dev/null
          pkill -x demo_server 2>/dev/null
          lsof -ti tcp:8080 2>/dev/null | while read -r p; do kill "$p" 2>/dev/null; done
          echo "demo target stopped"

  # ── verifier: a second, independent implementation of the same protocol ─────
  # The point of a verification format is that more than one program can
  # implement it. docs/VERIFIER.html is a self-contained page that verifies a
  # bundle offline in the browser — no dependencies, no network, no build step —
  # and it must agree with the Go verifier case by case. This job holds that to
  # three tests:
  #   1. unit tests: SHA-256 and the Merkle tree are checked against Node's own
  #      crypto as an independent oracle;
  #   2. a drift gate: the page is generated from the tested module, so CI fails
  #      if docs/VERIFIER.html has fallen behind it (a stale page would ship code
  #      that no test ever ran);
  #   3. a parity gate: a real signed bundle, tampered four ways, must produce
  #      the same verdict from both verifiers — same valid flag, same counts,
  #      same digest, same failing check names.
  # Node 26 is pinned because the page verifies Ed25519 through WebCrypto.
  verifier:
    name: Verifier (Go == JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Exact patch, not "26": a moving major can pick up a Node patch with
          # a WebCrypto/Ed25519 regression, and this job is the parity gate for
          # exactly that code path. 26.13.1 is the current 26.x LTS (Lithium).
          node-version: "26.13.1"

      - name: Unit tests for the JavaScript verifier
        run: node --test web/verifier/vpmp.test.mjs

      - name: The shipped page matches the tested module (no drift)
        run: node web/verifier/build-html.mjs --check

      - name: Go and JavaScript verifiers agree on real evidence
        run: bash scripts/verify-html-parity.sh

      - name: Upload the offline verifier page
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifier-page
          path: docs/VERIFIER.html
          if-no-files-found: error

  # ── one required status check ─────────────────────────────────────────────
  # Configure branch protection to require only `ci-ok` from this workflow.
  # Without an aggregate, a green subset of checks could still merge a build
  # whose lint or fuzz leg was red. `if: always()` is required: with the default
  # condition GitHub marks this job "skipped" when a needed job fails, and a
  # skipped required check does not give branch protection a clear failure.
  #
  # Scope note: security.yml and codeql.yml are separate workflows and have
  # their own checks; GitHub cannot put their jobs in this workflow's `needs`.
  # Their own aggregate jobs (or a workflow_run meta gate) belong in those
  # files. This job is the single required gate for everything defined here.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
      - shellcheck
      - deploy-validate
      - test
      - test-unit
      - test-integration
      - test-integration-focused
      - coverage
      - build
      - bench
      - fuzz
      - docker
      - verifiable-evidence
      - verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS"])
          bad = {name: item["result"] for name, item in results.items() if item["result"] != "success"}
          if bad:
              for name, result in sorted(bad.items()):
                  print("::error::job %s finished with result %s" % (name, result))
              sys.exit(1)
          print("all %d CI jobs passed" % len(results))
          PY
