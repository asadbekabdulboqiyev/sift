name: Protobuf check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-${{ github.ref }}
  cancel-in-progress: true

env:
  # Go comes from the patch-pinned `go` directive in go.mod via
  # `go-version-file` below; only non-Go tools are pinned here.
  PROTOC_VERSION: "36.0"
  PROTOC_GEN_GO_VERSION: "v1.36.12"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.6.2"

jobs:
  generated-code:
    name: Generated Go code matches the .proto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ env.PROTOC_GEN_GO_GRPC_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate
        run: make proto

      - name: Fail if generated files drifted
        run: git diff --exit-code -- internal/dist/proto/

      - name: Test generated code
        run: go test ./internal/dist/proto/... -count=1
